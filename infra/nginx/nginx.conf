# infra/nginx/nginx.conf
# Nginx reverse proxy config for non-Kubernetes deployments
# (e.g., a single VM or bare-metal setup with Docker Compose).
# In Kubernetes, the ingress controller replaces this.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Rate limiting zone (10 MB shared memory, 30 req/s per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream: FastAPI app (docker-compose service name)
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.contractauditor.io;

        # TLS — certificate managed by certbot or mounted from secrets
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Request size limit (contracts are small JSON)
        client_max_body_size 1m;

        # Health check — no rate limiting, no auth
        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location /ready {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # API routes — rate limited
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Audit pipeline can take up to 2 minutes
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # PDF downloads — longer timeout, larger response
        location ~ ^/v1/reports/.+/pdf$ {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            proxy_buffering off;   # Stream PDF directly to client
        }

        # OpenAPI docs (disable in production if desired)
        location ~ ^/(docs|redoc|openapi.json)$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Block everything else
        location / {
            return 404;
        }
    }
}

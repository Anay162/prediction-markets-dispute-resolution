# infra/k8s/ingress.yaml
# Nginx ingress with TLS termination via cert-manager.
# Assumes cert-manager is installed and a ClusterIssuer named
# "letsencrypt-prod" exists.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-auditor-ingress
  namespace: contract-auditor
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.contractauditor.io
      secretName: contract-auditor-tls
  rules:
    - host: api.contractauditor.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contract-auditor-api
                port:
                  name: http

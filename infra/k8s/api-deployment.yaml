# infra/k8s/api-deployment.yaml
# API server Deployment + Service + HorizontalPodAutoscaler
#
# Assumptions:
#   - Image is pushed to a registry at $REGISTRY/contract-auditor-api:$TAG
#   - Secrets are in the "contract-auditor" namespace as "app-secrets"
#   - PostgreSQL and Redis are external (RDS + ElastiCache)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-auditor-api
  namespace: contract-auditor
  labels:
    app: contract-auditor
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contract-auditor
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: contract-auditor
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/contract-auditor-api:TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          command:
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
            - --log-level
            - info
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # WeasyPrint needs a writable /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: contract-auditor-api
  namespace: contract-auditor
spec:
  selector:
    app: contract-auditor
    component: api
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contract-auditor-api-hpa
  namespace: contract-auditor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contract-auditor-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

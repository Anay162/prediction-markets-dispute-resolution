[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prediction-markets-dispute-resolution"
version = "0.1.0"
description = "AI-powered adversarial contract audit tool for prediction markets"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.1",
    "pgvector>=0.2.5",          # PostgreSQL vector extension for similarity search

    # Cache
    "redis>=5.0.3",

    # LLM clients
    "anthropic>=0.25.0",
    "openai>=1.25.0",           # Fallback + embeddings

    # Async HTTP (for enrichment probes)
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",

    # Task queue
    "celery[redis]>=5.3.6",

    # Report generation
    "weasyprint>=62.0",
    "jinja2>=3.1.3",

    # Utilities
    "python-dateutil>=2.9.0",
    "difflib2>=0.0.1",          # Diff generation for rewrite comparisons

    # Observability
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient
    "factory-boy>=3.3.0",       # Test fixtures
    "respx>=0.21.0",            # Mock httpx
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=70"

[tool.setuptools.packages.find]
where = ["."]

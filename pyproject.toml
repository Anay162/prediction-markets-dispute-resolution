[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-markets-dispute-resolution"
version = "0.1.0"
description = "AI-powered adversarial contract audit tool for prediction markets"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.1",
    "pgvector>=0.2.5",          # PostgreSQL vector extension for similarity search

    # Cache
    "redis>=5.0.3",

    # LLM clients
    "anthropic>=0.25.0",
    "openai>=1.25.0",           # Fallback + embeddings

    # Async HTTP (for enrichment probes)
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",

    # Task queue
    "celery[redis]>=5.3.6",

    # Report generation
    "weasyprint>=62.0",
    "jinja2>=3.1.3",

    # Utilities
    "python-dateutil>=2.9.0",

    # Observability
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient
    "factory-boy>=3.3.0",       # Test fixtures
    "respx>=0.21.0",            # Mock httpx
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "pytest-dotenv>=0.5.2",
    "pytest-timeout>=2.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI uses Depends() in function defaults — intentional pattern
    "B905",   # zip() without strict= — not required for this codebase
    "UP042",  # StrEnum migration — deferred for Pydantic v2 compatibility
    "E501",   # Line too long — long strings in prompts/evidence text
    "E711",   # == None comparisons — SQLAlchemy generates IS NULL via ==
    "E712",   # == True comparisons — SQLAlchemy boolean column filter pattern
    "SIM102", # Nested if — readability preference
    "SIM105", # contextlib.suppress — try/except is clearer in this context
    "E741",   # Ambiguous variable name
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
env_files = [".env.test"]

[tool.setuptools.packages.find]
where = ["."]

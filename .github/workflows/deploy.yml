# .github/workflows/deploy.yml
# CD pipeline: build images → push to registry → rolling deploy to k8s
# Triggered on merge to main after CI passes.

name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/contract-auditor

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image prefix
        id: lower
        run: echo "prefix=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.prefix }}-worker:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.prefix }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Check KUBECONFIG secret
        id: check
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::KUBECONFIG secret not configured — skipping Kubernetes deploy"
          fi

      - name: Configure kubeconfig
        if: steps.check.outputs.configured == 'true'
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig

      - name: Update image tags in manifests
        if: steps.check.outputs.configured == 'true'
        run: |
          TAG=${{ needs.build-and-push.outputs.tag }}
          REGISTRY=${{ env.REGISTRY }}
          PREFIX=${{ env.IMAGE_PREFIX }}
          sed -i "s|REGISTRY_PLACEHOLDER/contract-auditor-api:TAG_PLACEHOLDER|${REGISTRY}/${PREFIX}-api:${TAG}|g" infra/k8s/api-deployment.yaml
          sed -i "s|REGISTRY_PLACEHOLDER/contract-auditor-worker:TAG_PLACEHOLDER|${REGISTRY}/${PREFIX}-worker:${TAG}|g" infra/k8s/worker-deployment.yaml

      - name: Apply manifests
        if: steps.check.outputs.configured == 'true'
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f infra/k8s/api-deployment.yaml
          kubectl apply -f infra/k8s/worker-deployment.yaml

      - name: Wait for rollout
        if: steps.check.outputs.configured == 'true'
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl rollout status deployment/contract-auditor-api -n contract-auditor --timeout=120s
          kubectl rollout status deployment/contract-auditor-worker -n contract-auditor --timeout=120s
